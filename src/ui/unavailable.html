<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <title>没有找到 dsh web 服务</title>
  <style>
    :root { color-scheme: light dark; --fg: #1b1b1f; --muted: #61616b; --bg: #f6f6f8; --card: #ffffff; --line: #e2e2e8; --accent: #4d6bfe; }
    @media (prefers-color-scheme: dark) {
      :root { --fg: #ececf1; --muted: #a0a0ac; --bg: #151517; --card: #1d1d21; --line: #2c2c33; --accent: #7b90ff; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 14px/1.6 system-ui, -apple-system, "Noto Sans CJK SC", sans-serif; color: var(--fg); background: var(--bg); }
    main { width: min(680px, 92vw); background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 28px 30px; }
    h1 { margin: 0 0 6px; font-size: 20px; }
    p { margin: 0 0 12px; color: var(--muted); }
    code { font-family: ui-monospace, "JetBrains Mono", monospace; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; font-size: 12.5px; }
    pre { margin: 10px 0 16px; padding: 12px 14px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; overflow-x: auto; font-size: 12.5px; }
    ul { margin: 0 0 14px; padding-left: 18px; color: var(--muted); }
    .status { margin: 16px 0 18px; padding: 10px 12px; border-radius: 8px; background: var(--bg); border: 1px solid var(--line); font-size: 12.5px; color: var(--muted); }
    .row { display: flex; gap: 10px; flex-wrap: wrap; }
    button { font: inherit; padding: 8px 16px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--fg); cursor: pointer; }
    button.primary { background: var(--accent); border-color: transparent; color: #fff; font-weight: 600; }
    button:hover { filter: brightness(1.08); }
  </style>
</head>
<body>
  <main>
    <h1>没有找到正在运行的 dsh web</h1>
    <p>这个壳只连接你<strong>自己启动</strong>的 dsh，不会替你另起一个。请在终端启动 Web 服务：</p>
    <pre>dsh web --no-open --host 127.0.0.1 --port 3080</pre>
    <p>启动后会打印一行 <code>dsh web: http://…</code> 的地址；如果服务已经跑在别的端口或网卡上，可以点「设置」直接填它。</p>
    <p>判断依据：本地监听端口中由 <code>dsh … web</code> 进程持有的那个，且根路径返回 dsh 的页面或 401 认证提示。</p>
    <div class="status" id="status">正在自动重试…</div>
    <div class="row">
      <button class="primary" id="retry">立即重试</button>
      <button id="settings">设置地址…</button>
      <button id="logs">打开日志</button>
      <button id="quit">退出</button>
    </div>
  </main>
  <script>
    const statusEl = document.getElementById('status')
    window.dshShell.getState().then((state) => {
      if (state.probes && state.probes.length > 0) {
        const lines = state.probes.map((probe) => `· ${probe.url} — ${probe.error ?? '无响应'}`)
        statusEl.textContent = `已尝试：\n${lines.join('\n')}`
        statusEl.style.whiteSpace = 'pre-line'
      }
    })
    window.dshShell.onRetryStatus((status) => {
      statusEl.style.whiteSpace = 'pre-line'
      statusEl.textContent = status.message
    })
    document.getElementById('retry').addEventListener('click', () => window.dshShell.retry())
    document.getElementById('settings').addEventListener('click', () => window.dshShell.openSettings())
    document.getElementById('logs').addEventListener('click', () => window.dshShell.openLogs?.())
    document.getElementById('quit').addEventListener('click', () => window.dshShell.quit())
  </script>
</body>
</html>

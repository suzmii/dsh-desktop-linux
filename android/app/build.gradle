plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.dsh.desktop'
    compileSdk 35

    defaultConfig {
        applicationId 'dev.dsh.desktop'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
        resConfigs 'zh', 'en'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Verification/sideload builds only: replace with a private keystore
            // before publishing anywhere.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }

    lint {
        abortOnError false
    }

    packaging {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*']
        }
    }
}

configurations.all {
    // zxing-android-embedded 4.3.0 still pulls the pre-1.8 jdk7/jdk8 Kotlin shims,
    // which duplicate classes now bundled in kotlin-stdlib. The shims are empty
    // facades on Kotlin 1.8, so dropping them and pinning one stdlib is correct.
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'org.jetbrains.kotlin'
                && details.requested.name.startsWith('kotlin-stdlib')) {
            details.useVersion '1.8.22'
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    testImplementation 'junit:junit:4.13.2'
}
